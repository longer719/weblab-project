#configs/detector_training.yaml
# 该配置文件用于训练病害检测器

# 数据配置
data:
  data_dir: "data/processed"
  batch_size: 8  # 检测任务每批次图像较少
  train_split: 0.7
  val_split: 0.1
  test_split: 0.2
  num_workers: 16  # 增加工作线程


# 模型配置 
model:
  backbone: "resnet50"  # 轻量级骨干网络，检测任务足够
  num_classes: 38       # 全部PlantVillage类别
  pretrained: true
  min_size: 800         # 提高到800以检测更多细节
  max_size: 1333
  # 禁用自动计算锚框
  compute_anchors: false
  # 移除自定义锚框配置，使用默认设置
  box_score_thresh: 0.3
  box_nms_thresh: 0.55
  rpn_nms_thresh: 0.7

# 训练配置 - 针对RTX 4090D优化
train:
  epochs: 50            
  lr: 0.0001            
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"  
  scheduler_params:             
    eta_min: 0.0000005         
  weight_decay: 0.0005  # 检测器使用较小的权重衰减值
  mixed_precision: true  
  warmup_epochs: 3       
  backbone_lr: 0.00005   
  mixup_alpha: 0.0       
  cutmix_alpha: 1.0      # 保留CutMix以增强泛化性
  mixcut_prob: 0.5       
  grad_accumulation_steps: 2  
  seed: 42
  save_interval: 5
  vis_samples: 10
  early_stopping:
    patience: 10         # 可根据需要调整
    delta: 0.001
    mode: 'max'          # 修改为max，accuracy/f1越高越好
    monitor: 'accuracy'  # 用accuracy，监控分类准确率
  device: "cuda"

# 实验命名
experiment_name: "disease_detector_second_version_full_dataset"