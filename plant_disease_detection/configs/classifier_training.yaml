# configs/classifier_training.yaml
# 数据配置
data:
  data_dir: "data/processed"
  batch_size: 64  # 适合24GB显存的RTX 4090D
  train_split: 0.7
  val_split: 0.1
  test_split: 0.2
  num_workers: 16  # 增加工作线程利用多核CPU


# 模型配置 
model:
  backbone: "resnet101"  # 使用深层网络更好地捕获丰富的特征
  num_classes: 38       # 全部PlantVillage类别
  pretrained: true
  dropout_rate: 0.5     # 增加到0.5，进一步提高正则化效果
  in_channels: 3

# 训练配置 - 针对RTX 4090D优化
train:
  epochs: 100           # 充分训练
  lr: 0.0001           # 稍小的学习率以稳定训练
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"  # 由OneCycleLR改为CosineAnnealingLR余弦退火调度器
  scheduler_params:              # 新增调度器参数子字典
    eta_min: 0.0000001          # 设置最小学习率(约为lr的1/1000)
  weight_decay: 0.01    # 分类器使用较大的权重衰减值
  mixed_precision: true # 使用混合精度训练加速
  seed: 42
  warmup_epochs: 5      # 新增: 第一阶段只训练头部的轮数
  backbone_lr: 0.00001  # 新增: 第二阶段backbone的学习率(显著小于头部)
  label_smoothing: 0.1  # 新增: 标签平滑系数(0.1通常是很好的起点)
  mixup_alpha: 0.2      # 设置 MixUp 参数 (0.2是很好的起点值)
  cutmix_alpha: 0.0     # 禁用 CutMix (专注于MixUp效果)
  save_interval: 5      # 每5个epoch保存一次
  early_stopping:
    patience: 15        # 增加耐心值
    delta: 0.001
    mode: 'max'
    monitor: 'val_acc'
  device: "cuda"

# 实验命名
experiment_name: "plant_classifier_second_version_full_dataset"